services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      kong:
        condition: service_started
    networks:
      - edge

  kong:
    image: kong:latest
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "off"
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    expose:
      - "8000"
    networks:
      - edge
      - backend
    depends_on:
      usuarios:
        condition: service_healthy
      productos:
        condition: service_healthy
      pedidos:
        condition: service_healthy

  usuarios:
    build: ./usuarios
    environment:
      DATABASE_URL: postgresql://usuarios:[REDACTED]@postgres:5432/usuarios
    expose:
      - "8000"
    networks:
      - backend
      - usuarios_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  productos:
    build: ./productos
    environment:
      DATABASE_URL: mysql+pymysql://productos:[REDACTED]@mysql:3306/productos
    expose:
      - "8000"
    networks:
      - backend
      - productos_db
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  pedidos:
    build: ./pedidos
    volumes:
      - pedidos_data:/data
    environment:
      SQLITE_PATH: /data/pedidos.sqlite3
    expose:
      - "8000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: usuarios
      POSTGRES_USER: usuarios
      POSTGRES_PASSWORD: usuarios_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - usuarios_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuarios -d usuarios"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: productos
      MYSQL_USER: productos
      MYSQL_PASSWORD: productos_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - productos_db
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
  mysql_data:
  pedidos_data:

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  usuarios_db:
    driver: bridge
    internal: true
  productos_db:
    driver: bridge
    internal: true
